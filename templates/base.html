<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DataHub Internal — Databricks{% endblock %}</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Modular Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- Modular Sidebar Navigation -->
  {% include 'components/sidebar.html' %}

  <!-- Main View Area -->
  <div class="main">
    <!-- Modular Topbar Header -->
    {% include 'components/topbar.html' %}

    <!-- Dynamic Modular Pages Content -->
    {% block content %}{% endblock %}
  </div>

  <!-- Lucide Icons -->
  <script src="{{ url_for('static', filename='js/vendor/lucide.min.js') }}"></script>
  <!-- Modular Scripts -->
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
  <script src="{{ url_for('static', filename='js/components.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
